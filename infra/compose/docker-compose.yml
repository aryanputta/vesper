version: "3.9"

# =============================================================================
# VESPER – Docker Compose Stack
# =============================================================================

networks:
  vesper_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  ml_models:

services:

  # ---------------------------------------------------------------------------
  # Redis – message broker / cache
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: vesper_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - vesper_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ---------------------------------------------------------------------------
  # TimescaleDB (PostgreSQL 15) – time-series telemetry store
  # ---------------------------------------------------------------------------
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: vesper_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: vesper
      POSTGRES_PASSWORD: vesper
      POSTGRES_DB: vesper
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vesper_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vesper -d vesper"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Backend – FastAPI / VESPER core service
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.backend
    container_name: vesper_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "8001:8001"   # Prometheus metrics endpoint
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - ../../.env
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql+asyncpg://vesper:vesper@postgres:5432/vesper
      PYTHONPATH: /app
    networks:
      - vesper_network

  # ---------------------------------------------------------------------------
  # Prometheus – metrics collection
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: vesper_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    networks:
      - vesper_network

  # ---------------------------------------------------------------------------
  # Grafana – dashboard visualisation
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: vesper_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: vesper
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - vesper_network

  # ---------------------------------------------------------------------------
  # Dashboard – frontend (React / Next.js)
  # ---------------------------------------------------------------------------
  dashboard:
    build:
      context: ../..
      dockerfile: dashboard/Dockerfile
    container_name: vesper_dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    networks:
      - vesper_network

  # ---------------------------------------------------------------------------
  # ML Trainer – dataset generation + model training (profile: training)
  # ---------------------------------------------------------------------------
  ml_trainer:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.ml
    container_name: vesper_ml_trainer
    command: >
      sh -c "python scripts/generate_dataset.py --samples 500000 &&
             python scripts/train_model.py"
    volumes:
      - ml_models:/app/ml/models
    environment:
      PYTHONPATH: /app
    networks:
      - vesper_network
    profiles:
      - training
